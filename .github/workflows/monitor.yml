name: 上汽大众任务雷达

on:
  schedule:
    # 每 5 分钟检查一次（GitHub 高峰期可能延迟几分钟，属正常）
    - cron: '*/5 * * * *'
  workflow_dispatch:      # 支持在 Actions 页面手动点一下立即运行

permissions:
  contents: write         # 允许把运行状态写回仓库

concurrency:
  group: task-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 检查有没有新任务
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          KOC_TOKEN: ${{ secrets.KOC_TOKEN }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
          SOURCES: ${{ vars.SOURCES }}
        run: python3 monitor.py

      - name: 保存运行状态
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "task-radar-bot"
            git config user.email "task-radar-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 更新监控状态"
            git push
          else
            echo "状态无变化，无需提交"
          fi
